<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klik Foto → Shoppe Affiliate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #fdfcfb 0%, #e2e1e0 100%);
    color: #222;
    padding: 24px 16px;
    text-align: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 6px;
  }
  .sub {
    color: #666;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    max-width: 1000px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    width: 240px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: block;
  }
  .card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 14px 30px rgba(0,0,0,0.14);
  }
  .card .thumb-wrap {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    background: #eee;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }
  .card:hover img {
    transform: scale(1.06);
  }
  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.4px;
    backdrop-filter: blur(4px);
  }
  .card .body {
    padding: 12px 14px 14px;
  }
  .card .nama {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .harga {
    font-size: 14px;
    font-weight: 600;
    color: #c62828;
    margin-top: 4px;
  }
  .card .link-label {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
  }
  .tap-note {
    margin-top: 28px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>

<h1>Klik foto untuk beli di Shoppe</h1>
<p class="sub">Pilih produk → links langsung buka di Shoppe</p>

<div class="grid" id="grid"></div>

<p class="tap-note">Gunakan link affiliate resmi Shoppe. Pastikan sesuai dengan persyaratan program afiliasi.</p>

<script>
// ============================
// EDIT DAFTAR PRODUK DI SINI
// ============================
const produk = [
  {
    nama: "Contoh Produk A",
    harga: "Rp 45.000",
    link: "https://shope.ee/CONTOH_LINK_1",
    img: "https://placehold.co/400x400/eee/333?text=Foto+1"
  },
  {
    nama: "Contoh Produk B",
    harga: "Rp 89.000",
    link: "https://shope.ee/CONTOH_LINK_2",
    img: "https://placehold.co/400x400/ddd/333?text=Foto+2"
  },
  {
    nama: "Contoh Produk C",
    harga: "Rp 120.000",
    link: "https://shope.ee/CONTOH_LINK_3",
    img: "https://placehold.co/400x400/ccc/333?text=Foto+3"
  }
];

// Nggak perlu edit di bawah ini kalau cuma mau ganti produk
const grid = document.getElementById("grid");
grid.innerHTML = produk.map(p => `
  <a class="card" href="${p.link}" target="_blank" rel="noopener">
    <div class="thumb-wrap">
      <img src="${p.img}" alt="${p.nama}" loading="lazy">
      <span class="badge">KLIK</span>
    </div>
    <div class="body">
      <div class="nama">${p.nama}</div>
      <div class="harga">${p.harga}</div>
      <div class="link-label">klik untuk beli di Shoppe</div>
    </div>
  </a>
`).join("");
</script>

</body>
</html>
